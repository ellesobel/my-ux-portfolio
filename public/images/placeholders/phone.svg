<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401 861">
  <!-- A 393x853 screen (the artboard size of the app designs) inside a 4px
       ink frame, matching the frame demo videos get on the site. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d7ee"/>
      <stop offset="1" stop-color="#d9e2f5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="393" height="853" rx="48" fill="url(#screen)" stroke="#1c1c1c" stroke-width="8"/>
  <g fill="none" stroke="#1c1c1c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" opacity=".55">
    <rect x="124" y="360" width="152" height="120" rx="16"/>
    <polyline points="136,464 184,412 216,444 236,424 264,464"/>
    <circle cx="230" cy="392" r="12"/>
  </g>
  <text x="200" y="548" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="600" fill="#1c1c1c" opacity=".55">Screen placeholder</text>
</svg>
