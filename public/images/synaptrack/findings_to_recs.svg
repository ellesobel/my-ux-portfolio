<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Quicksand, 'Helvetica Neue', Arial, sans-serif">
  <title>What usability testing surfaced in SynapTrack, and what I recommended</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d7ee"/>
      <stop offset="1" stop-color="#d9e2f5"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#1c1c1c">
    <text x="28" y="44">WHAT I SAW</text>
    <text x="358" y="44">WHAT I RECOMMENDED</text>
  </g>

  <g fill="#fff" fill-opacity=".85" stroke="#1c1c1c" stroke-width="2">
    <rect x="24" y="60" width="270" height="96" rx="14"/>
    <rect x="24" y="168" width="270" height="96" rx="14"/>
    <rect x="24" y="276" width="270" height="96" rx="14"/>
    <rect x="346" y="60" width="270" height="96" rx="14"/>
    <rect x="346" y="168" width="270" height="96" rx="14"/>
    <rect x="346" y="276" width="270" height="96" rx="14"/>
  </g>

  <g stroke="#1c1c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#head)">
    <line x1="304" y1="108" x2="334" y2="108"/>
    <line x1="304" y1="216" x2="334" y2="216"/>
    <line x1="304" y1="324" x2="334" y2="324"/>
  </g>

  <g font-size="15" fill="#1c1c1c">
    <text x="42" y="94">Users skimmed instructions</text>
    <text x="42" y="114">and mistook the demo for</text>
    <text x="42" y="134">the task itself.</text>

    <text x="42" y="202">Light and dark mode text,</text>
    <text x="42" y="222">and Android&#8217;s nav, were</text>
    <text x="42" y="242">too low-contrast to notice.</text>

    <text x="42" y="310">Phone notifications broke</text>
    <text x="42" y="330">into vibration tasks and</text>
    <text x="42" y="350">muddied the data.</text>

    <text x="364" y="94">Numbered steps of equal</text>
    <text x="364" y="114">weight, plus audio cues</text>
    <text x="364" y="134">for the walking test.</text>

    <text x="364" y="202">Bigger, higher-contrast nav,</text>
    <text x="364" y="222">text and buttons in</text>
    <text x="364" y="242">both themes.</text>

    <text x="364" y="310">Pause notifications, or</text>
    <text x="364" y="330">prompt Do Not Disturb</text>
    <text x="364" y="350">before the task starts.</text>
  </g>
</svg>
